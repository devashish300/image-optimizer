services:
  app:
    build: .
    ports:
      - "3000:3000"
    # If a .env file exists in the project root, docker compose reads it
    # automatically and its values are used below. Without a .env the MinIO
    # defaults apply, so a fresh clone runs with zero configuration.
    # For real AWS S3: put real credentials in .env and set "S3_ENDPOINT="
    # (empty) so the app talks directly to AWS.
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY-minioadmin}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET-my-images}
      - AWS_REGION=${AWS_REGION-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT-http://minio:9000}
    depends_on:
      - minio

  # Local S3-compatible storage for development/testing without an AWS account
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - "minio_data:/data"

volumes:
  minio_data:
