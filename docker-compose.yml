services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Reads credentials/bucket/region from your .env file.
    # - Real AWS S3: no S3_ENDPOINT line in .env — that's all it takes.
    # - Local MinIO:  set S3_ENDPOINT=http://minio:9000 in .env
    #   ("minio" is the container hostname; localhost won't work from inside
    #   the app container).
    env_file:
      - .env
    depends_on:
      - minio

  # Local S3-compatible storage for development/testing without an AWS account
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - "minio_data:/data"

volumes:
  minio_data:
